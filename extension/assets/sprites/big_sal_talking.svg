<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <!-- Big Sal: wise mentor. Two-state viseme sprite (talking). -->
  <ellipse cx="100" cy="192" rx="62" ry="7" fill="#000" opacity=".12"/>
  <!-- shoulders / cardigan -->
  <path d="M30 200c4-34 30-50 70-50s66 16 70 50z" fill="#3f5d8a"/>
  <path d="M78 152l22 30 22-30" fill="#f4f1ea"/>
  <path d="M100 182v18" stroke="#2c4366" stroke-width="3"/>
  <circle cx="100" cy="189" r="2.5" fill="#c9a24a"/>
  <!-- neck -->
  <rect x="86" y="132" width="28" height="24" rx="10" fill="#d9a77c"/>
  <!-- ears -->
  <ellipse cx="45" cy="92" rx="9" ry="13" fill="#d09a6e"/><ellipse cx="155" cy="92" rx="9" ry="13" fill="#d09a6e"/>
  <!-- head -->
  <path d="M100 26c34 0 56 24 56 62 0 34-22 58-56 58s-56-24-56-58c0-38 22-62 56-62z" fill="#e2b48a"/>
  <!-- gray hair on the sides -->
  <path d="M46 84c-2-22 8-38 20-44-8 14-10 28-8 46z" fill="#c9c9cc"/>
  <path d="M154 84c2-22-8-38-20-44 8 14 10 28 8 46z" fill="#c9c9cc"/>
  <!-- flat cap -->
  <path d="M42 62c6-30 34-42 60-42 30 0 52 14 58 38-30-10-80-10-118 4z" fill="#5b4636"/>
  <path d="M40 62c30-12 92-14 124-2l2 6c-36-10-90-8-128 4z" fill="#3e2f24"/>
  <!-- eyebrows -->
  <path d="M62 74q14-8 28 0" stroke="#bdbdc2" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M110 74q14-8 28 0" stroke="#bdbdc2" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- glasses -->
  <circle cx="77" cy="90" r="15" fill="#fff" fill-opacity=".35" stroke="#2b2b30" stroke-width="3.5"/>
  <circle cx="123" cy="90" r="15" fill="#fff" fill-opacity=".35" stroke="#2b2b30" stroke-width="3.5"/>
  <path d="M92 90q8-5 16 0" stroke="#2b2b30" stroke-width="3" fill="none"/>
  <!-- eyes (kind, slightly smiling) -->
  <path d="M70 91q7-6 14 0" stroke="#2b2b30" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M116 91q7-6 14 0" stroke="#2b2b30" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- nose -->
  <path d="M100 96q-8 16 0 20 6 1 9-2" stroke="#b9825a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="66" cy="112" rx="9" ry="5" fill="#e58f7a" opacity=".45"/><ellipse cx="134" cy="112" rx="9" ry="5" fill="#e58f7a" opacity=".45"/>
  <!-- mouth (closed smile) -->
  <path d="M85 125q15 -2 30 0q-2 18-15 18t-15-18z" fill="#5a2a22"/><path d="M90 136q10 -5 20 0q-3 6-10 6t-10-6z" fill="#e3757a"/><rect x="88" y="124" width="24" height="4" rx="2" fill="#fff"/>
  <!-- mustache -->
  <path d="M74 122c8-10 18-8 26-3 8-5 18-7 26 3-8 4-18 4-26 0-8 4-18 4-26 0z" fill="#d6d6da"/>
</svg>
