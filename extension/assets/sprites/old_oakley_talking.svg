<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <!-- Old Oakley: ancient oak spirit guide. Placeholder two-state viseme sprite (talking). -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#fff7c2" stop-opacity=".55"/><stop offset="1" stop-color="#fff7c2" stop-opacity="0"/></radialGradient>
    <linearGradient id="bark" x1="0" x2="1"><stop offset="0" stop-color="#6b4a2f"/><stop offset=".5" stop-color="#8a6240"/><stop offset="1" stop-color="#5c3f27"/></linearGradient>
  </defs>
  <circle cx="100" cy="95" r="90" fill="url(#glow)"/>
  <ellipse cx="100" cy="193" rx="66" ry="6" fill="#000" opacity=".12"/>
  <!-- canopy -->
  <g fill="#4f8a3c">
    <circle cx="58" cy="52" r="30"/><circle cx="100" cy="34" r="34"/><circle cx="142" cy="52" r="30"/>
    <circle cx="36" cy="82" r="20"/><circle cx="164" cy="82" r="20"/>
  </g>
  <g fill="#6aa84f" opacity=".85"><circle cx="80" cy="36" r="16"/><circle cx="124" cy="30" r="14"/><circle cx="150" cy="58" r="12"/><circle cx="52" cy="60" r="12"/></g>
  <!-- trunk / face -->
  <path d="M58 70c10-6 74-6 84 0 6 40 8 82 18 120H40c10-38 12-80 18-120z" fill="url(#bark)"/>
  <!-- roots -->
  <path d="M40 190c-6 2-14 3-22 2M160 190c6 2 14 3 22 2M78 190q-6 4-12 6M122 190q6 4 12 6" stroke="#5c3f27" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- bark grain -->
  <path d="M66 140q4 20 2 40M134 140q-4 20-2 40M100 156q2 14 0 30" stroke="#4a321f" stroke-width="2.5" fill="none" opacity=".6"/>
  <!-- brows (heavy, knotted) -->
  <path d="M64 86q16-12 32-2" stroke="#3e2a1a" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M104 84q16-10 32 2" stroke="#3e2a1a" stroke-width="7" stroke-linecap="round" fill="none"/>
  <!-- glowing eyes, half-lidded -->
  <ellipse cx="80" cy="98" rx="10" ry="7" fill="#2b1d12"/><ellipse cx="120" cy="98" rx="10" ry="7" fill="#2b1d12"/>
  <ellipse cx="80" cy="99" rx="5" ry="4" fill="#ffe680"/><ellipse cx="120" cy="99" rx="5" ry="4" fill="#ffe680"/>
  <path d="M68 94q12-6 24 0M108 94q12-6 24 0" stroke="#5c3f27" stroke-width="4" fill="none"/>
  <!-- knot nose -->
  <ellipse cx="100" cy="116" rx="6" ry="8" fill="#5a3d25"/>
  <!-- moss beard -->
  <path d="M70 128q30 30 60 0q-4 26-30 34q-26-8-30-34z" fill="#7fa86a" opacity=".9"/>
  <!-- mouth (closed) -->
  <path d="M85 128q15-3 30 0q-3 18-15 18t-15-18z" fill="#24170e"/><ellipse cx="100" cy="140" rx="7" ry="3" fill="#ffe680" opacity=".6"/>
  <!-- fireflies -->
  <circle cx="30" cy="120" r="2.5" fill="#ffe680"/><circle cx="172" cy="128" r="2" fill="#ffe680"/><circle cx="160" cy="20" r="2" fill="#ffe680"/>
</svg>
